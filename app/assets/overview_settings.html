<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SHC Live Stats - Übersicht-Einstellungen</title>
<link rel="icon" href="/icons/app_logo.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background-color: #1b140c;
    background-image: url('/bg/program.png');
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #f2e9d8;
    font-family: "Segoe UI", Trebuchet MS, Arial, sans-serif;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(15, 10, 5, 0.72);
    z-index: -1;
  }
  h1 {
    font-size: 20px;
    border-bottom: 1px solid #c6a15b;
    padding-bottom: 8px;
  }
  h2 {
    font-size: 15px;
    color: #c6a15b;
    margin-top: 28px;
  }
  .cat-count {
    font-size: 11px;
    font-weight: 400;
    color: #a89478;
  }
  /* Kleines "i"-Symbol statt ausufernder Dauertext-Absätze unter jedem
     Regler/Abschnitt - Erklärung erscheint per nativem Tooltip (title-
     Attribut) erst bei Bedarf beim Draufhalten. */
  .info-tip {
    display: inline-block;
    cursor: help;
    color: #a89478;
    font-size: 13px;
    margin-left: 4px;
    line-height: 1;
  }
  .card {
    background: #241a10;
    border: 1px solid #c6a15b;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
    max-width: 560px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
  }
  .row label {
    flex: 1;
    font-size: 14px;
  }
  button {
    background: #c6a15b;
    color: #1b140c;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #d8b878; }
  /* Zeigt, welcher Knopf gerade dem aktuellen Zustand entspricht (aktive
     Anzeige-Vorlage, volle "Alle an/aus"-Kategorie, geladener Speicherplatz)
     - sieht aus wie hineingedrückt statt nur farblich markiert. */
  button.active-preset {
    background: #8a6d3f;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.6);
    transform: translateY(1px);
  }
  button.active-preset:hover { background: #8a6d3f; }
  input[type="checkbox"] { width: 18px; height: 18px; }
  input[type="number"], select {
    background: #1b140c;
    color: #f2e9d8;
    border: 1px solid #c6a15b;
    border-radius: 4px;
    padding: 4px 6px;
    width: 80px;
  }
  select { width: auto; min-width: 160px; }
  input[type="color"] {
    width: 44px;
    height: 28px;
    padding: 2px;
    background: #1b140c;
    border: 1px solid #c6a15b;
    border-radius: 4px;
    cursor: pointer;
  }
  input[type="range"] {
    flex: 1;
    max-width: 180px;
    accent-color: #c6a15b;
  }
  .row input[type="number"] {
    width: 64px;
  }
  #status-line {
    font-size: 13px;
    padding: 8px 0;
  }
  .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .dot-ok { background: #9be89b; }
  .dot-waiting { background: #e6c34a; }
  .dot-error { background: #ff8a7a; }
  /* Eigener Pfeil statt des Browser-Standard-Markers, da <summary> hier oft
     als Flex-Container (Name + Knöpfe) gestylt ist - der native Marker
     würde dabei kaum sichtbar/falsch ausgerichtet erscheinen. */
  summary { list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .disclosure-arrow {
    display: inline-block;
    transition: transform 0.15s ease;
    margin-right: 6px;
  }
  details[open] > summary .disclosure-arrow {
    transform: rotate(90deg);
  }
</style>
</head>
<body>
  <h1>Übersicht - eigene Einstellungen <span class="info-tip" title='Diese Einstellungen gelten nur für den Übersichtsmodus (diese Seite hier) - das OBS-Overlay im Stream bleibt davon unberührt und hat seine eigene Konfiguration.'>&#9432;</span></h1>

  <div id="status-line"><span class="dot dot-waiting"></span>Status wird geladen &hellip;</div>

  <h2>Gewinnwahrscheinlichkeits-Balken <span class="info-tip" title='EXPERIMENTELL - derselbe Balken wie im OBS-Overlay, hier oben in der Übersicht (kein Positions-/Größen-Regler nötig, sitzt einfach im normalen Seitenfluss). Modus UND Team-Farben gelten gemeinsam mit dem Overlay-Balken (dieselbe Einstellung) - Team-Farben werden aktuell nur in den normalen Overlay-Einstellungen (Bereich "Teams") gesetzt.'>&#9432;</span></h2>
  <div class="card">
    <div class="row">
      <label>Balken oben in der Übersicht anzeigen</label>
      <input type="checkbox" id="win-bar-overview-toggle">
    </div>
    <div class="row">
      <label>Balken-Modus</label>
      <select id="win-bar-mode-input">
        <option value="segmented">Segmentiert (ein Balken, Anteile)</option>
        <option value="individual">Einzel-Balken pro Fraktion</option>
      </select>
    </div>
  </div>

  <h2>Speicherplätze <span class="info-tip" title='Speichert das komplette Aussehen dieser Übersicht unter einem Namen deiner Wahl - mit "Laden" jederzeit wieder abrufbar.'>&#9432;</span></h2>
  <div class="card">
    <div id="saved-layouts-list"></div>
  </div>

  <h2>Anzeige-Vorlagen <span class="info-tip" title='Setzt mit einem Klick, welche Werte unten angezeigt werden. Betrifft nicht Design/Farben ("Design &amp; Anordnung") oder die Häkchen unter "Sonstiges".'>&#9432;</span></h2>
  <div class="card">
    <div class="row" style="flex-wrap:wrap; gap:8px;">
      <button type="button" data-preset="standard">Standard</button>
      <button type="button" data-preset="minimal">Minimal</button>
      <button type="button" data-preset="militär">Militär</button>
      <button type="button" data-preset="alles">Alles an</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="flex-wrap:wrap; gap:8px; align-items:center;">
      <button type="button" id="sync-overlay-btn">Mit Overlay synchronisieren</button>
      <span class="info-tip" title='Übernimmt einmalig die Anzeige-Auswahl und Farb-/Design-Einstellungen vom Overlay in die Übersicht. Sobald danach hier irgendetwas geändert wird, gilt der Abgleich als überholt (Knopf springt zurück).'>&#9432;</span>
    </div>
  </div>

  <details id="display-section" open>
    <summary style="cursor:pointer; color:#c6a15b; font-size:15px; font-weight:600; margin-top:28px;"><span class="disclosure-arrow">&#9654;</span>Was soll angezeigt werden?</summary>
    <div id="display-categories" style="margin-top:10px;"></div>
  </details>

  <h2>Design &amp; Anordnung</h2>
  <div class="card">
    <div class="row">
      <label>Design <span class="info-tip" title='Bei SHC Single/Multi bekommen die Karten ein Pergament als Hintergrund; Rahmenfarben bleiben weiterhin aktiv.'>&#9432;</span></label>
      <select id="theme-input">
        <option value="rgb">RGB (frei einstellbare Farben)</option>
        <option value="shc_single">SHC Single (ein Pergament je Seite)</option>
        <option value="shc_multi">SHC Multi (Pergament pro Rahmen)</option>
      </select>
    </div>
    <div class="row">
      <label>Seiten-Aufteilung</label>
      <select id="side-mode-input">
        <option value="split">Geteilt (links/rechts)</option>
        <option value="left">Alle links</option>
        <option value="right">Alle rechts</option>
        <option value="teams">Nach Team (siehe "Teams" unten)</option>
      </select>
    </div>
    <div class="row">
      <label>Abstand zwischen den Zeilen (px)</label>
      <input type="range" id="row-gap-range" min="0" max="60" step="1">
      <input type="number" id="row-gap-input" min="0" max="60" step="1">
    </div>
    <div class="row">
      <label>Truppen-Icon-Größe (px)</label>
      <input type="range" id="breakdown-icon-range" min="10" max="60" step="1">
      <input type="number" id="breakdown-icon-input" min="10" max="60" step="1">
    </div>
    <div class="row">
      <label>Textfarbe (Beschriftung/Werte)</label>
      <input type="color" id="text-color-input">
      <button type="button" data-reset-color-input="text-color-input" data-reset-color-key="text_color" data-reset-color-default="#f2e9d8">Standard</button>
    </div>
    <div class="row">
      <label>Farbe für dein eigenes Feld</label>
      <input type="color" id="you-color-input">
      <button type="button" data-reset-color-input="you-color-input" data-reset-color-key="you_color" data-reset-color-default="#78c8ff">Standard</button>
    </div>
  </div>

  <h2>Angriffs-Warnung</h2>
  <div class="card">
    <div class="row">
      <label>Angriffs-Warnung farblich hervorheben</label>
      <input type="checkbox" data-key="highlight_attack_status">
    </div>
    <div class="row">
      <label>Farbe bei Angriffs-Warnung</label>
      <input type="color" id="attack-color-input">
      <button type="button" data-reset-color-input="attack-color-input" data-reset-color-key="attack_color" data-reset-color-default="#e6463c">Standard</button>
    </div>
    <div class="row">
      <label>Angriffs-Warnung pulsierend leuchten lassen</label>
      <input type="checkbox" id="attack-pulse-input">
    </div>
  </div>

  <h2>Teams <span class="info-tip" title='Automatisch: live erkannt, korrekt ab dem ersten Tick nach Matchstart, kein Warten nötig. Manuell: du trägst die Team-Nummern selbst ein - z.B. falls die Erkennung mal falsch liegt. Es gilt IMMER nur einer der beiden Modi, nie eine Mischung pro Spieler - im Modus "Manuell" sind die Felder unten aktiv, im Modus "Automatisch" gesperrt. Bei Seiten-Aufteilung "Nach Team" oben landet dein Team (inkl. Spieler 1) links, alle anderen rechts. Gilt gemeinsam für Overlay und Übersicht.'>&#9432;</span></h2>
  <div class="card">
    <div id="team-assignment-list" style="margin-top:4px;"></div>
  </div>

  <script>
    let currentConfig = null;

    // Anzeige-Häkchen in aufklappbare Kategorien gruppiert (statt einer
    // langen flachen Liste) - jede Kategorie bekommt eigene "Alle an/aus"-
    // Knöpfe. Wird per JS aus dieser Liste gebaut, siehe renderDisplayCategories().
    const DISPLAY_CATEGORIES = [
      {
        name: "Rohstoffe",
        items: [
          ["show_gold", "Gold"],
          ["show_wood", "Holz"],
          ["show_stone", "Stein"],
          ["show_iron", "Eisen"],
          ["show_ale", "Bier"],
          ["show_pitch", "Pech"],
          ["show_hops", "Hopfen"],
          ["show_wheat", "Getreide"],
          ["show_flour", "Mehl"],
        ],
      },
      {
        name: "Nahrung",
        items: [
          ["show_food_total", "Nahrung gesamt"],
          ["show_bread", "Brot"],
          ["show_cheese", "Käse"],
          ["show_meat", "Fleisch"],
          ["show_apples", "Äpfel"],
        ],
      },
      {
        name: "Waffen & Rüstung",
        items: [
          ["show_bows", "Bögen"],
          ["show_crossbows", "Armbrüste"],
          ["show_spears", "Speere"],
          ["show_pikes", "Piken"],
          ["show_maces", "Keulen"],
          ["show_swords", "Schwerter"],
          ["show_leather_armor", "Lederrüstung"],
          ["show_metal_armor", "Metallrüstung"],
        ],
      },
      {
        name: "Militär",
        items: [
          ["show_troops_total", "Truppen gesamt"],
          ["show_troop_breakdown", "Truppen-Aufschlüsselung nach Typ (Icons)"],
          ["show_monks_trained", "Mönche (aktueller Bestand)"],
          ["show_siege_movable", "Belagerungsgeräte gesamt (Sammelwert ganz rechts in der Truppen-Zeile, kein Einzeltyp möglich)"],
        ],
      },
      {
        name: "Sonstiges",
        items: [
          ["show_popularity", "Popularity"],
          ["show_tax_rate", "Steuersatz (Stufe 1-12)"],
          ["show_population", "Bevölkerung (aktuell/Kapazität)"],
          ["show_lord_hp", "Burgherr-HP"],
          ["show_win_probability", "Gewinnwahrscheinlichkeit (experimentell)", "EXPERIMENTELL, erste Version: heuristischer Wert aus Truppen- und Waffenlager-Bestand (Kampfwert-Tabelle einer Custom-KI-Liga), Wirtschaft (Ressourcen/Bevölkerung/Popularity) und deren Wachstumstrend über die letzten Minuten (damit eine früh dominante, aber stagnierende KI nicht automatisch als \"führend\" gilt) - keine kalibrierte Vorhersage, viele Gewichte darin sind Platzhalter ohne echte Herleitung. Bei genau 2 Seiten (Spieler oder per Team-Zuordnung gebildete Teams) eine echte Gewinnwahrscheinlichkeit. Bei 3 oder mehr Seiten (z.B. Free-for-all) rechnet jede Seite gegen den kompletten Rest des Feldes gleichzeitig - bei einem fairen Kräfteverhältnis liegt der Wert dann für ALLE Seiten unter 50%, das ist kein Fehler, sondern die Definition."],
          ["show_demo_data", "Platzhalter-Spieler anzeigen, solange kein Spiel läuft"],
        ],
      },
    ];

    const STAT_PRESET_KEYS = DISPLAY_CATEGORIES.flatMap((cat) => cat.items.map(([key]) => key)).filter(
      (key) => key !== "show_demo_data"
    );

    function presetFrom(trueKeys) {
      const obj = {};
      STAT_PRESET_KEYS.forEach((key) => { obj[key] = trueKeys.includes(key); });
      return obj;
    }

    const DISPLAY_PRESETS = {
      standard: presetFrom(["show_gold", "show_wood", "show_stone", "show_iron", "show_troops_total", "show_popularity", "show_lord_hp"]),
      minimal: presetFrom(["show_gold", "show_troops_total", "show_popularity"]),
      militär: presetFrom(["show_troops_total", "show_troop_breakdown", "show_siege_movable"]),
      alles: presetFrom(STAT_PRESET_KEYS),
    };

    function renderDisplayCategories() {
      const container = document.getElementById("display-categories");
      container.innerHTML = DISPLAY_CATEGORIES.map((cat, idx) => `
        <details class="card">
          <summary style="cursor:pointer; color:#c6a15b; display:flex; align-items:center; justify-content:space-between; gap:10px;">
            <span><span class="disclosure-arrow">&#9654;</span>${cat.name} <span class="cat-count" data-cat-badge="${idx}"></span></span>
            <span>
              <button type="button" data-cat="${idx}" data-mode="1">Alle an</button>
              <button type="button" data-cat="${idx}" data-mode="0">Alle aus</button>
            </span>
          </summary>
          <div style="margin-top:8px;">
            ${cat.items.map(([key, label, tooltip]) => `<div class="row"><label>${label}${tooltip ? ` <span class="info-tip" title='${tooltip}'>&#9432;</span>` : ""}</label><input type="checkbox" data-key="${key}"></div>`).join("")}
          </div>
        </details>
      `).join("");

      updateCategoryCounts();

      container.querySelectorAll("button[data-cat]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const cat = DISPLAY_CATEGORIES[parseInt(btn.dataset.cat, 10)];
          const value = btn.dataset.mode === "1";
          const patch = {};
          cat.items.forEach(([key]) => { patch[key] = value; });
          savePatch(patch);
        });
      });
    }

    // Zeigt "(x/y)" neben jedem Rubrik-Namen, damit der eingeklappte
    // Zustand ("x an") trotzdem auf einen Blick erkennbar bleibt, statt
    // extra aufklappen zu müssen - Idee aus der Layout-Review, günstiger
    // als ein Dropdown (siehe project_shc_overlay_status.md).
    function updateCategoryCounts() {
      const cfg = currentConfig || {};
      DISPLAY_CATEGORIES.forEach((cat, idx) => {
        const badge = document.querySelector(`[data-cat-badge="${idx}"]`);
        if (!badge) return;
        const on = cat.items.filter(([key]) => cfg[key]).length;
        badge.textContent = `(${on}/${cat.items.length})`;
      });
    }

    // Muss vor dem generischen data-key-Checkbox-Handler weiter unten
    // laufen, damit dieser die hier neu erzeugten Checkboxen auch findet.
    renderDisplayCategories();

    document.querySelectorAll("button[data-preset]").forEach((btn) => {
      btn.addEventListener("click", () => {
        savePatch(DISPLAY_PRESETS[btn.dataset.preset]);
      });
    });

    function deepEqual(a, b) {
      if (a === b) return true;
      if (typeof a !== "object" || typeof b !== "object" || a === null || b === null) return false;
      const keysA = Object.keys(a);
      const keysB = Object.keys(b);
      if (keysA.length !== keysB.length) return false;
      return keysA.every((k) => deepEqual(a[k], b[k]));
    }

    // 5 komplette Speicherplätze fürs ganze Aussehen dieser Übersicht -
    // hier ist die Config flach (keine display/layout-Unterbereiche wie im
    // Overlay), also einfach eine Kopie von allem AUSSER saved_layouts
    // selbst (sonst würde ein Speicherplatz sich selbst mit-speichern).
    function currentLookSnapshot() {
      const { saved_layouts, ...rest } = currentConfig;
      return JSON.parse(JSON.stringify(rest));
    }

    function escapeHtmlAttr(s) {
      const div = document.createElement("div");
      div.textContent = s == null ? "" : s;
      return div.innerHTML;
    }

    function renderSavedLayouts() {
      const list = document.getElementById("saved-layouts-list");
      const slots = (currentConfig && currentConfig.saved_layouts) || [];
      list.innerHTML = slots.map((slot, i) => `
        <div class="row" style="flex-wrap:wrap;">
          <label>${slot ? escapeHtmlAttr(slot.name) : `Speicherplatz ${i + 1} (leer)`}</label>
          <button type="button" data-load-slot="${i}" ${slot ? "" : "disabled"}>Laden</button>
          <button type="button" data-save-slot="${i}">Speichern</button>
          ${slot ? `<button type="button" data-clear-slot="${i}">Löschen</button>` : ""}
        </div>
      `).join("");

      list.querySelectorAll("button[data-load-slot]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slot = currentConfig.saved_layouts[parseInt(btn.dataset.loadSlot, 10)];
          if (!slot) return;
          const { name, ...rest } = slot;
          savePatch(rest);
        });
      });
      list.querySelectorAll("button[data-save-slot]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.dataset.saveSlot, 10);
          const existing = currentConfig.saved_layouts[i];
          const name = prompt("Name für diesen Speicherplatz:", existing ? existing.name : `Setup ${i + 1}`);
          if (!name) return;
          const slots = currentConfig.saved_layouts.slice();
          slots[i] = { name, ...currentLookSnapshot() };
          savePatch({ saved_layouts: slots });
        });
      });
      list.querySelectorAll("button[data-clear-slot]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.dataset.clearSlot, 10);
          const slots = currentConfig.saved_layouts.slice();
          slots[i] = null;
          savePatch({ saved_layouts: slots });
        });
      });
    }

    // Markiert, welcher Knopf gerade dem aktuellen Zustand entspricht (sieht
    // wie hineingedrückt aus) - bei Anzeige-Vorlagen, den "Alle an/aus"-
    // Knöpfen je Kategorie, und geladenen Speicherplätzen.
    function updateActiveHighlights() {
      document.querySelectorAll("button[data-preset]").forEach((btn) => {
        const preset = DISPLAY_PRESETS[btn.dataset.preset];
        const matches = STAT_PRESET_KEYS.every((key) => !!currentConfig[key] === !!preset[key]);
        btn.classList.toggle("active-preset", matches);
      });
      document.querySelectorAll("button[data-cat]").forEach((btn) => {
        const cat = DISPLAY_CATEGORIES[parseInt(btn.dataset.cat, 10)];
        const wantOn = btn.dataset.mode === "1";
        const matches = cat.items.every(([key]) => !!currentConfig[key] === wantOn);
        btn.classList.toggle("active-preset", matches);
      });
      const snapshot = currentLookSnapshot();
      document.querySelectorAll("button[data-load-slot]").forEach((btn) => {
        const slot = currentConfig.saved_layouts[parseInt(btn.dataset.loadSlot, 10)];
        const matches = !!slot && deepEqual((({ name, ...rest }) => rest)(slot), snapshot);
        btn.classList.toggle("active-preset", matches);
      });
    }

    function setStatus(dotClass, text) {
      document.getElementById("status-line").innerHTML =
        `<span class="dot ${dotClass}"></span>${text}`;
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        const s = await res.json();
        if (s.connected) {
          setStatus("dot-ok", `Verbunden - ${s.player_count} Spieler aktiv` + (s.aic_loaded ? "" : " (keine .aic-Datei geladen)"));
        } else if (s.last_error) {
          setStatus("dot-error", s.last_error);
        } else {
          setStatus("dot-waiting", "Warte auf laufendes Spiel (Stronghold Crusader HD oder Extreme) &hellip;");
        }
      } catch (e) {
        setStatus("dot-error", "Server nicht erreichbar.");
      }
    }

    const SLIDER_PAIRS = [
      ["row-gap-range", "row-gap-input"],
      ["breakdown-icon-range", "breakdown-icon-input"],
    ];
    SLIDER_PAIRS.forEach(([rangeId, numberId]) => {
      const range = document.getElementById(rangeId);
      const number = document.getElementById(numberId);
      range.addEventListener("input", () => {
        number.value = range.value;
        number.dispatchEvent(new Event("input", { bubbles: true }));
      });
      number.addEventListener("input", () => {
        range.value = number.value;
      });
    });

    function applyConfigToForm(cfg) {
      currentConfig = cfg;
      document.querySelectorAll("input[type=checkbox][data-key]").forEach((el) => {
        el.checked = !!cfg[el.dataset.key];
      });
      updateCategoryCounts();
      document.getElementById("side-mode-input").value = cfg.side_mode;
      document.getElementById("theme-input").value = cfg.theme || "rgb";
      document.getElementById("row-gap-input").value = cfg.row_gap_px;
      document.getElementById("breakdown-icon-input").value = cfg.breakdown_icon_size_px ?? 22;
      document.getElementById("text-color-input").value = cfg.text_color;
      document.getElementById("you-color-input").value = cfg.you_color;
      document.getElementById("attack-color-input").value = cfg.attack_color;
      document.getElementById("attack-pulse-input").checked = !!cfg.attack_pulse;
      document.getElementById("win-bar-overview-toggle").checked = !!(cfg.win_bar && cfg.win_bar.show_in_overview);
      document.getElementById("win-bar-mode-input").value = (cfg.win_bar && cfg.win_bar.mode) || "segmented";
      SLIDER_PAIRS.forEach(([rangeId, numberId]) => {
        document.getElementById(rangeId).value = document.getElementById(numberId).value;
      });
      renderTeamAssignmentRows(cfg);
      renderSavedLayouts();
      updateActiveHighlights();
    }

    function renderTeamAssignmentRows(cfg) {
      const list = document.getElementById("team-assignment-list");
      const assign = cfg.team_assignment || {};
      const mode = cfg.team_assignment_mode || "auto";
      const isManual = mode === "manual";
      list.innerHTML = "";

      const modeRow = document.createElement("div");
      modeRow.className = "row";
      modeRow.style.marginBottom = "8px";
      modeRow.innerHTML = `
        <label style="flex:0 0 90px;">Modus</label>
        <select id="team-mode-input" style="flex:1;">
          <option value="auto">Automatisch (Live-Erkennung)</option>
          <option value="manual">Manuell</option>
        </select>
      `;
      list.appendChild(modeRow);
      const modeSelect = modeRow.querySelector("#team-mode-input");
      modeSelect.value = mode;
      modeSelect.addEventListener("change", (e) => {
        savePatch({ team_assignment_mode: e.target.value });
      });

      for (let i = 0; i < 8; i++) {
        const val = assign[String(i)];
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `
          <label style="flex:0 0 90px;">Spieler ${i + 1}</label>
          <span class="team-live-name" data-slot="${i}" style="flex:1; font-size:11px; color:#a89478;"></span>
          <span style="font-size:11px; color:#a89478;">Team</span>
          <input type="number" data-team-slot="${i}" min="1" max="8" step="1" style="width:60px;" value="${val === null || val === undefined ? "" : val}" placeholder="-" ${isManual ? "" : "disabled"}>
        `;
        list.appendChild(row);
      }
      list.querySelectorAll("input[data-team-slot]").forEach((el) => {
        el.addEventListener("change", () => {
          const slot = el.dataset.teamSlot;
          const raw = el.value.trim();
          const val = raw === "" ? null : parseInt(raw, 10);
          savePatch({ team_assignment: { [slot]: val } });
        });
      });
      refreshLiveTeamNames();
    }

    async function refreshLiveTeamNames() {
      try {
        const res = await fetch("/overlay.json?t=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        const bySlot = {};
        (data.players || []).forEach((p) => { bySlot[p.slot] = p.label; });
        document.querySelectorAll(".team-live-name").forEach((el) => {
          const slot = Number(el.dataset.slot);
          el.textContent = bySlot[slot] || "(leer)";
        });
      } catch (e) {
        // stiller Retry
      }
    }

    async function loadConfig() {
      const res = await fetch("/api/overview-config", { cache: "no-store" });
      applyConfigToForm(await res.json());
    }

    async function savePatch(patch, opts) {
      opts = opts || {};
      const res = await fetch("/api/overview-config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(patch),
      });
      applyConfigToForm(await res.json());
      // Jede Änderung AUSSER dem Sync-Vorgang selbst macht den Abgleich
      // ungültig - der Knopf zeigt dann wieder den unsynchronisierten
      // Zustand.
      if (!opts.fromSync) {
        setSyncButtonState(false);
      }
    }

    // Welche Felder beim Sync vom Overlay (display/layout) in die
    // Übersicht (flacher Aufbau) übernommen werden - nur Felder, die es
    // in BEIDEN Config-Bereichen unter demselben Namen gibt. Overlay-
    // spezifische Sachen ohne Übersicht-Entsprechung (Logo, Angriffs-
    // Badge, Zeilen/Breite-Layout, Rahmenfarbe, Versätze) werden bewusst
    // NICHT übernommen.
    const SYNC_DISPLAY_KEYS = [
      "show_gold", "show_wood", "show_stone", "show_iron",
      "show_troops_total", "show_troop_breakdown", "show_siege_movable",
      "show_popularity", "show_population", "show_tax_rate",
      "show_monks_trained", "show_lord_hp", "show_win_probability",
      "highlight_attack_status", "show_demo_data",
      "show_food_total", "show_bread", "show_cheese", "show_meat", "show_apples",
      "show_ale", "show_pitch", "show_hops", "show_wheat", "show_flour",
      "show_bows", "show_crossbows", "show_spears", "show_pikes", "show_maces", "show_swords",
      "show_leather_armor", "show_metal_armor",
    ];
    const SYNC_LAYOUT_KEYS = ["side_mode", "theme", "row_gap_px", "you_color", "attack_color", "attack_pulse", "text_color"];

    function setSyncButtonState(synced) {
      const btn = document.getElementById("sync-overlay-btn");
      if (!btn) return;
      btn.classList.toggle("active-preset", synced);
      btn.textContent = synced ? "✓ Mit Overlay synchronisiert" : "Mit Overlay synchronisieren";
    }

    async function syncWithOverlay() {
      const res = await fetch("/api/config", { cache: "no-store" });
      const fullConfig = await res.json();
      const display = fullConfig.display || {};
      const layout = fullConfig.layout || {};
      const patch = {};
      SYNC_DISPLAY_KEYS.forEach((k) => { if (k in display) patch[k] = display[k]; });
      SYNC_LAYOUT_KEYS.forEach((k) => { if (k in layout) patch[k] = layout[k]; });
      await savePatch(patch, { fromSync: true });
      setSyncButtonState(true);
    }

    document.getElementById("sync-overlay-btn").addEventListener("click", syncWithOverlay);

    document.querySelectorAll("input[type=checkbox][data-key]").forEach((el) => {
      el.addEventListener("change", () => {
        savePatch({ [el.dataset.key]: el.checked });
      });
    });

    document.getElementById("side-mode-input").addEventListener("change", (e) => {
      savePatch({ side_mode: e.target.value });
    });
    document.getElementById("theme-input").addEventListener("change", (e) => {
      savePatch({ theme: e.target.value });
    });
    document.getElementById("attack-pulse-input").addEventListener("change", (e) => {
      savePatch({ attack_pulse: e.target.checked });
    });
    document.getElementById("win-bar-overview-toggle").addEventListener("change", (e) => {
      savePatch({ win_bar: { show_in_overview: e.target.checked } });
    });
    document.getElementById("win-bar-mode-input").addEventListener("change", (e) => {
      savePatch({ win_bar: { mode: e.target.value } });
    });

    let debounceTimer = null;
    function saveDebounced() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        savePatch({
          row_gap_px: parseInt(document.getElementById("row-gap-input").value, 10) || 0,
          text_color: document.getElementById("text-color-input").value,
          you_color: document.getElementById("you-color-input").value,
          attack_color: document.getElementById("attack-color-input").value,
          breakdown_icon_size_px: parseInt(document.getElementById("breakdown-icon-input").value, 10) || 22,
        });
      }, 80);
    }
    ["row-gap-input", "text-color-input", "you-color-input", "attack-color-input", "breakdown-icon-input"].forEach((id) => {
      document.getElementById(id).addEventListener("input", saveDebounced);
    });

    // Generischer "Standard"-Button fuer alle Farbwaehler (Nutzerwunsch
    // 2026-09-06) - setzt den Eingabewert auf den mitgegebenen Default und
    // feuert danach ein normales "input"-Event, statt die Speicher-Logik
    // hier zu duplizieren (gleiches Prinzip wie in settings.html).
    document.querySelectorAll("button[data-reset-color-input]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.resetColorInput);
        if (!input) return;
        input.value = btn.dataset.resetColorDefault;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      });
    });

    function heartbeat() {
      fetch("/api/heartbeat", { method: "POST" }).catch(() => {});
    }

    loadConfig();
    refreshStatus();
    heartbeat();
    setInterval(refreshStatus, 3000);
    setInterval(refreshLiveTeamNames, 3000);
    setInterval(heartbeat, 5000);
  </script>
</body>
</html>
