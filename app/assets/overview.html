<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SHC Live Stats - Übersicht</title>
<link rel="icon" href="/icons/app_logo.png">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #14100a;
    color: var(--text-color, #f2e9d8);
    font-family: "Segoe UI", Trebuchet MS, Arial, sans-serif;
    height: 100%;
  }
  #wrap {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #rows {
    display: flex;
    flex-direction: column;
    gap: var(--row-gap, 14px);
  }
  #rows.split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-auto-rows: min-content;
    align-items: start;
  }
  h1 {
    margin: 0 0 4px 0;
    font-size: 22px;
    color: #c6a15b;
  }
  .row {
    --row-bg: #241a10;
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 22px;
    background: var(--row-bg);
    border: 2px solid #c6a15b;
    border-radius: 8px;
    padding: 14px 22px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
    min-width: 0;
  }
  .row.you { border-color: var(--you-color, #78c8ff); }
  .row.attacking {
    border-color: var(--attack-color, #e6463c);
    --row-bg: #3c0c0a;
  }
  .row.attacking.pulse {
    animation: pulse 1s ease-in-out infinite;
  }
  /* Besiegter Lord: Karte bleibt bestehen statt zu verschwinden (siehe
     worker.py::_debounce_active_slots), wird stattdessen in Grautöne
     umgewandelt (Nutzerwunsch 2026-09-06/-10) - grayscale(1) mappt jede
     Farbe auf ihren Helligkeits-Grauwert, KEINE zusätzliche Transparenz. */
  .row.defeated {
    filter: grayscale(1);
  }

  /* Spiel vorbei oder pausiert (siehe worker.py Stall-Erkennung,
     payload.stalled): alles ausgrauen, aber nichts ausblenden. */
  body.stalled #rows,
  body.stalled #win-bar {
    filter: grayscale(1);
  }
  /* Theme "SHC Single": ein gemeinsames Pergament liegt hinter allen
     Rahmen (siehe #rows.theme-single-bg / .side-backdrop) - die einzelnen
     Zeilen werden dafür komplett transparent, damit es unverändert
     durchscheint (genauso hell wie bei "SHC Multi", wo jede Zeile direkt
     dasselbe Pergament als eigenes Bild bekommt). */
  .row.theme-shc {
    --row-bg: transparent;
  }
  #rows.theme-single-bg,
  .side-backdrop {
    background-image: url('/bg/frame-parchment.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }
  .side-backdrop {
    /* #rows.split nutzt align-items:start (siehe oben), sonst würde dieser
       leere Platzhalter-Div auf Höhe 0 zusammenschrumpfen statt die volle
       Grid-Zeilenspanne auszufüllen. */
    align-self: stretch;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 8px 2px var(--attack-color, #e6463c); }
    50% { box-shadow: 0 0 24px 8px var(--attack-color, #e6463c); }
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 26px;
    flex: 1;
    min-width: 0;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 26px;
    font-variant-numeric: tabular-nums;
    /* Ohne Mindestbreite hat .stat nur seinen reinen Inhalt als Breite -
       bei schmaleren Kartenbreiten (z.B. 2-spaltige "Geteilt"/"Nach Team"-
       Ansicht in einem nicht sehr breiten Fenster) passte dann oft nur
       EIN Wert pro Zeile in .stats, wodurch die ganze Karte (und mit ihr
       die Lord-HP-Säule, die per align-self:stretch auf Kartenhöhe
       mitwächst) absurd hoch wurde - die Säule sah dadurch wie ein
       duenner Strich statt einer richtigen Fuellstandsanzeige aus (vom
       Nutzer mit Screenshot gemeldet, 2026-09-06 - Ursache war NICHT die
       Saeule selbst, siehe Live-Messung: Kartenhoehe von 852px statt der
       paar hundert Pixel, die eine normale Karte braucht). 140px reicht
       fuer Icon+Zahl bequem und lässt trotzdem mehrere Werte pro Zeile
       zu, bevor wirklich umgebrochen wird. */
    flex: 0 0 auto;
    min-width: 140px;
  }
  .stat img { width: 30px; height: 30px; object-fit: contain; }
  /* Feste Mindestbreite fuer den Zahlen-Text (Nutzeridee 2026-09-06):
     anders als im Overlay (dort hat .stat schon eine feste Gesamtbreite
     per Grid, siehe overlay.html) wächst hier jedes .stat-Element bisher
     mit der Ziffernanzahl seines Werts - sobald z.B. Gold von 4- auf
     5-stellig wechselt, schiebt das alle folgenden Icons in derselben
     Zeile nach rechts. 5ch (Breite von 5 Ziffern in der aktuellen
     Schriftgröße dank font-variant-numeric:tabular-nums oben, skaliert
     also mit "Schriftgröße" in den Einstellungen mit) deckt Gold im
     5-stelligen Bereich als Referenzgröße ab, wie vom Nutzer vorgeschlagen -
     kleinere Werte lassen dann einfach etwas Leerraum vor dem naechsten
     Icon, statt dass die Icons bei jeder Ziffern-Änderung wandern. */
  .stat > span:last-child { min-width: 5ch; }
  .stat .icon { font-size: 26px; }

  /* Truppen-Aufschlüsselung nach Typ: eigene Zeile unter den Haupt-Werten
     (flex-basis:100% zwingt sie im Flex-Wrap-Layout der .row auf eine neue
     Zeile), kleinere Icons als die Haupt-Stats, da hier bis zu 17 Typen
     gleichzeitig auftauchen können. */
  .breakdown {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    flex: 1 0 100%;
    padding-top: 8px;
    padding-right: 40px;
    border-top: 1px solid rgba(198, 161, 91, 0.35);
    font-size: 16px;
  }
  .breakdown .unit { display: flex; align-items: center; gap: 4px; }
  .breakdown .unit img {
    width: var(--breakdown-icon-size, 22px);
    height: var(--breakdown-icon-size, 22px);
    object-fit: contain;
  }

  /* Belagerungsgeräte-Summe als eigener, immer ganz rechts (oben, per
     position:absolute statt Flex-Reihenfolge) sitzender Platzhalter-
     Eintrag - kein Einzeltyp auffindbar, siehe Recherche. Gleiches
     Kastensymbol wie beim Sonstiges-Einzelwert "siege_movable_total". */
  .breakdown .unit.siege-combo {
    position: absolute;
    top: 8px;
    right: 0;
  }

  /* Steuersatz-Icon: Stimmungsgesicht mit einer kleinen Gold-Münze als
     Abzeichen dahinter versetzt (unten rechts). */
  .stat .tax-combo-icon { position: relative; width: 30px; height: 30px; flex: 0 0 30px; }
  .stat .tax-combo-icon .tax-gold-icon {
    position: absolute;
    width: 60%;
    height: 60%;
    bottom: -12%;
    right: -12%;
    object-fit: contain;
    filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.9));
  }
  .stat .tax-combo-icon .tax-mood-icon {
    position: absolute;
    width: 78%;
    height: 78%;
    top: 0;
    left: 0;
    object-fit: contain;
  }
  .status {
    /* Sitzt rechts auf der oberen Rahmenlinie der Karte (halb drüber/halb
       drunter), statt eine eigene Zeile im Layout zu belegen - spiegel-
       bildlich zum Namens-Badge (sitzt links, siehe .name-badge). Vorher
       mittig (left:50%) positioniert - bei schmalen Fenstern/Karten und
       einem langen Status-Text wie "ANGRIFF BEVORSTEHEND" konnte das den
       Namens-Badge überlappen, weil beide unabhängig voneinander
       positioniert waren (vom Nutzer mit Screenshot gemeldet, 2026-09-06).
       Rechts statt mittig + eigenes max-width/Kürzung als zusätzliches
       Sicherheitsnetz schließt eine Kollision jetzt strukturell aus, bei
       jeder Kartenbreite. */
    position: absolute;
    top: 0;
    right: 22px;
    transform: translateY(-50%);
    z-index: 1;
    font-size: 16px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 6px;
    background: #1b140c;
    border: 2px solid #c6a15b;
    white-space: nowrap;
    /* 35%, nicht mehr - zusammen mit dem Namens-Badge (max-width 45%, s.o.)
       und je 22px Randabstand auf beiden Seiten bleibt so rechnerisch bei
       JEDER Kartenbreite eine Luecke zwischen beiden, keine Kollision mehr
       moeglich (45%+35%+2×22px-Abstand < 100% der Kartenbreite, auch bei
       sehr schmalen Karten - vorher 50% reichte dafuer noch nicht). */
    max-width: 35%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status.attack { color: #ff8a7a; border-color: var(--attack-color, #e6463c); }

  /* Namens-Badge - dieselbe schwebende Pille wie .status, nur links statt
     mittig (deckt sich mit dem Look, den overlay.html schon für Namen
     nutzt - 2026-09-06 auf Nutzerwunsch auch hier ergänzt, vorher war der
     Name nur ein normaler, flach im Zeilenfluss stehender Text). */
  .name-badge {
    position: absolute;
    top: 0;
    left: 22px;
    transform: translateY(-50%);
    z-index: 1;
    font-size: 16px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 6px;
    background: #1b140c;
    border: 2px solid #c6a15b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 45%;
  }

  /* Burgherr-HP als eigene Säule links (2026-09-06 auf Nutzerwunsch ergänzt
     - vorher nur ein normaler Prozent-Wert mitten in .stats). Gleiches
     Prinzip wie overlay.html (siehe dortiger .lord-hp-col-Kommentar für die
     Herleitung), hier aber größer skaliert und per align-self:stretch auf
     volle Zeilenhöhe gebracht statt einer per-JS berechneten Fixhöhe - die
     Übersicht hat kein festes Zeilenhöhen-System wie das Overlay. */
  .lord-hp-col {
    flex: 0 0 44px;
    min-width: 0;
    min-height: 64px;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
  }
  .lord-hp-track {
    flex: 1 1 auto;
    width: 18px;
    min-height: 0;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid #c6a15b;
    border-radius: 4px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .lord-hp-fill { width: 100%; border-radius: 2px; }
  .lord-hp-fill.hp-high { background: #4caf50; }
  .lord-hp-fill.hp-mid { background: #d8b93a; }
  .lord-hp-fill.hp-low { background: var(--attack-color, #e6463c); }
  .lord-hp-fill.hp-none { background: transparent; }
  .lord-hp-pct {
    flex: 0 0 auto;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
  }

  #empty-msg {
    font-size: 18px;
    color: #a89478;
  }

  /* Stärkeindex-Balken - dieselbe Logik wie im Overlay
     (siehe overlay.html), hier aber im normalen Seitenfluss statt
     position:fixed (kein OBS-Crop/Positionierung nötig, sitzt einfach
     oben über den Spieler-Karten). Kartenoptik (Rahmenfarbe/-radius/
     Schatten) bewusst an .row oben angeglichen statt eigene Werte. */
  #win-bar {
    display: none;
  }
  #win-bar-segmented {
    display: flex;
    width: 100%;
    min-height: 60px;
    background: #241a10;
    border: 2px solid #c6a15b;
    border-radius: 8px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
    box-sizing: border-box;
    overflow: hidden;
  }
  #win-bar .segment {
    position: relative;
    display: flex;
    /* flex-basis:0 - siehe ausfuehrlichen Kommentar bei derselben Regel in
       win_bar.html (sonst verschiebt der Textinhalt/Labellaenge die
       Aufteilung weg vom echten share_percent-Verhaeltnis). */
    flex-basis: 0;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
    font-weight: 700;
    font-size: 22px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    /* --transition-ms = Staerkeindex-Refresh-Intervall, damit die
       Balkengrenze durchgehend gleitet - siehe WIN_BAR_TRANSITION_MS-
       Kommentar in win_bar.html. */
    transition: flex-grow var(--transition-ms, 2000ms) linear;
    padding: 10px;
  }

  /* Leuchten an jeder Nahtstelle - siehe ausfuehrlicher Kommentar bei
     derselben Regel in win_bar.html (Original dieser duplizierten Regel).
     KEIN mix-blend-mode - siehe dortige Begruendung ("nicht weiss"). */
  #win-bar .segment::after,
  #win-bar .segment::before {
    position: absolute;
    top: 15%;
    bottom: 15%;
    width: 3px;
    border-radius: 2px;
    z-index: 2;
    pointer-events: none;
    background: var(--seam-color, transparent);
    animation: seam-glow 1.1s ease-in-out infinite;
  }
  #win-bar .segment:not(:last-child)::after { content: ""; right: -4px; }
  #win-bar .segment:not(:first-child)::before { content: ""; left: -4px; animation-delay: 0.55s; }

  @keyframes seam-glow {
    0%, 100% { opacity: 0.55; box-shadow: 0 0 4px 2px var(--seam-color); }
    50%      { opacity: 0.9;  box-shadow: 0 0 12px 4.5px var(--seam-color); }
  }

  #win-bar-individual {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    background: #241a10;
    border: 2px solid #c6a15b;
    border-radius: 8px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
    box-sizing: border-box;
    padding: 14px 22px;
  }
  #win-bar .individual-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  #win-bar .individual-label {
    flex: 0 0 160px;
    min-width: 0;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #win-bar .individual-track {
    position: relative;
    flex: 1 1 auto;
    height: 26px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 5px;
    overflow: hidden;
  }
  #win-bar .individual-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    transition: width var(--transition-ms, 450ms) linear;
  }
  #win-bar .individual-percent {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  }
  #settings-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    background: #c6a15b;
    color: #1b140c;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 18px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #settings-toggle:hover { background: #d8b878; }
  #settings-panel {
    position: fixed;
    top: 0;
    right: 0;
    /* Die Übersicht-Einstellungen sind nur ein einfaches Formular (kein
       Vorschaupanel wie bei den normalen Einstellungen) - daher reicht ein
       schmalerer Ausschnitt, der nicht fast die ganze Seite verdeckt. */
    width: min(640px, 92vw);
    height: 100%;
    overflow: auto;
    background: #14100a;
    border-left: 3px solid #c6a15b;
    box-shadow: -6px 0 20px rgba(0,0,0,0.6);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 9;
  }
  #settings-panel.open {
    transform: translateX(0);
  }
  #settings-panel iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
  <button id="settings-toggle" type="button">&#9881; Einstellungen</button>
  <div id="settings-panel">
    <iframe id="settings-frame" src="about:blank"></iframe>
  </div>

  <div id="wrap">
    <h1>Stronghold Crusader - Live Übersicht</h1>
    <div id="win-bar">
      <div id="win-bar-segmented" style="display:none;"></div>
      <div id="win-bar-individual" style="display:none;"></div>
    </div>
    <div id="rows"></div>
    <div id="empty-msg" style="display:none;">Warte auf Spieldaten &hellip;</div>
  </div>

  <script>
    // Feste Reihenfolge fuer die Truppen-Aufschluesselung (.breakdown) -
    // kaempfende Europaeer vor kaempfenden Arabern vor Moenchen vor der
    // Baumeister-Gruppe (Baumeister/Leitertraeger/Tunnelbauer bauen nur,
    // kaempfen nicht - eigene Rolle). Bewusst NICHT strikt nach Nation
    // (europaeisch/arabisch) sortiert, da jeder Lord theoretisch jede
    // Einheit bauen kann (besonders bei custom KIs haeufig) - die
    // Kategorien sind also eher "kaempfende Europaeer/Araber" als eine
    // feste Fraktions-Zuordnung. Belagerungsgeraete-Einzeltypen sind hier
    // bewusst NICHT gelistet (nicht auffindbar, siehe
    // project_shc_overlay_status.md) - wuerden aber, wenn irgendwann
    // gefunden, direkt nach der Baumeister-Gruppe einsortiert werden.
    // Unbekannte/neue Keys fallen ans Ende.
    const UNIT_BREAKDOWN_ORDER = [
      "unit_archer", "unit_crossbowman", "unit_spearman", "unit_pikeman", "unit_maceman",
      "unit_swordsman", "unit_knight",
      "unit_arab_archer", "unit_horse_archer", "unit_slave", "unit_assassin",
      "unit_slinger", "unit_fire_thrower", "unit_arab_swordsman",
      "unit_monk",
      "unit_builder", "unit_laddercarrier", "unit_tunneler",
    ];

    function sortUnitEntries(entries) {
      return entries.slice().sort((a, b) => {
        const ia = UNIT_BREAKDOWN_ORDER.indexOf(a[0]);
        const ib = UNIT_BREAKDOWN_ORDER.indexOf(b[0]);
        return (ia === -1 ? UNIT_BREAKDOWN_ORDER.length : ia) - (ib === -1 ? UNIT_BREAKDOWN_ORDER.length : ib);
      });
    }

    const STAT_DEFS = [
      { flag: "show_gold",         key: "gold",                img: "/icons/resource_gold.png" },
      { flag: "show_wood",         key: "wood",                img: "/icons/resource_wood.png" },
      { flag: "show_stone",        key: "stone",               img: "/icons/resource_stone.png" },
      { flag: "show_iron",         key: "iron",                img: "/icons/resource_iron.png" },
      { flag: "show_food_total",   key: "food_total",          img: "/icons/resource_food_total.png" },
      { flag: "show_bread",        key: "bread",               img: "/icons/resource_bread.png" },
      { flag: "show_cheese",       key: "cheese",              img: "/icons/resource_cheese.png" },
      { flag: "show_meat",         key: "meat",                img: "/icons/resource_meat.png" },
      { flag: "show_apples",       key: "apples",              img: "/icons/resource_apples.png" },
      { flag: "show_ale",          key: "ale",                 img: "/icons/resource_ale.png" },
      { flag: "show_pitch",        key: "pitch",               img: "/icons/resource_pitch.png" },
      { flag: "show_hops",         key: "hops",                img: "/icons/resource_hops.png" },
      { flag: "show_wheat",        key: "wheat",               img: "/icons/resource_wheat.png" },
      { flag: "show_flour",        key: "flour",               img: "/icons/resource_flour.png" },
      { flag: "show_troops_total", key: "troops",              icon: "&#9876;&#65039;" },
      { flag: "show_monks_trained", key: "monks_trained",      img: "/icons/unit_monk.png" },
      { flag: "show_bows",         key: "bows",                img: "/icons/resource_bows.png" },
      { flag: "show_crossbows",    key: "crossbows",           img: "/icons/resource_crossbows.png" },
      { flag: "show_spears",       key: "spears",              img: "/icons/resource_spears.png" },
      { flag: "show_pikes",        key: "pikes",               img: "/icons/resource_pikes.png" },
      { flag: "show_maces",        key: "maces",               img: "/icons/resource_maces.png" },
      { flag: "show_swords",       key: "swords",              img: "/icons/resource_swords.png" },
      { flag: "show_leather_armor", key: "leather_armor",      img: "/icons/resource_leather_armor.png" },
      { flag: "show_metal_armor",  key: "metal_armor",         img: "/icons/resource_metal_armor.png" },
      { flag: "show_popularity",   key: "popularity",          img: "/icons/resource_popularity.png", isPercent: true },
      { flag: "show_tax_rate",     key: "tax_rate",            isTaxRate: true },
      { flag: "show_population",   key: "population",          img: "/icons/population.png", isPopulation: true },
      { flag: "show_win_probability", key: "win_probability_percent", icon: "&#9878;&#65039;", isWinProb: true },
    ];

    let cfg = {};

    function fmt(v) {
      return (v === null || v === undefined) ? "-" : v;
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s == null ? "" : s;
      return div.innerHTML;
    }

    function statValueText(def, p) {
      if (def.isTaxRate) {
        const tax = p.tax_rate;
        return (tax === null || tax === undefined) ? "-" : `${tax + 1}/12`;
      }
      if (def.isPercent) {
        return (p.popularity === null || p.popularity === undefined) ? "-" : p.popularity.toFixed(0);
      }
      if (def.isPopulation) {
        return (p.population === null || p.population === undefined) ? "-" : `${p.population}/${fmt(p.population_capacity)}`;
      }
      if (def.isWinProb) {
        const wp = p.win_probability_percent;
        return (wp === null || wp === undefined) ? "-" : wp + "%";
      }
      return fmt(p[def.key]);
    }

    function taxIconSrc(tax) {
      // <=3 (Spende bis "Keine Steuern", Standard, +1 Beliebtheit) = gute
      // Laune, darüber (echte Steuern) = schlechte Laune. Neutral bleibt
      // ungenutzt für unbekannte Werte reserviert.
      if (tax === null || tax === undefined) return "/icons/mood_neutral.png";
      return tax > 3 ? "/icons/mood_bad.png" : "/icons/mood_good.png";
    }

    function statHtml(def, p) {
      const val = statValueText(def, p);
      if (def.isTaxRate) {
        return `<div class="stat"><span class="tax-combo-icon"><img class="tax-gold-icon" src="/icons/resource_gold.png" alt=""><img class="tax-mood-icon" src="${taxIconSrc(p.tax_rate)}" alt=""></span><span>${val}</span></div>`;
      }
      const icon = def.img ? `<img src="${def.img}" alt="">` : `<span class="icon">${def.icon}</span>`;
      return `<div class="stat">${icon}<span>${val}</span></div>`;
    }

    function lordHpClass(pct) {
      if (pct === null || pct === undefined || pct <= 0) return "hp-none";
      if (pct > 66) return "hp-high";
      if (pct >= 33) return "hp-mid";
      return "hp-low";
    }

    // Eigene Säule statt normaler .stat-Eintrag (siehe .lord-hp-col-CSS-
    // Kommentar oben) - gleiches Prinzip wie overlay.html.
    function lordHpColHtml(p) {
      if (!cfg.show_lord_hp) return "";
      const pct = p.lord_hp_percent;
      const fillPct = (pct === null || pct === undefined) ? 0 : Math.max(0, Math.min(100, pct));
      const label = (pct === null || pct === undefined) ? "-" : `${pct}%`;
      return `
        <div class="lord-hp-col" title="Burgherr-HP">
          <div class="lord-hp-track"><div class="lord-hp-fill ${lordHpClass(pct)}" style="height:${fillPct}%"></div></div>
          <div class="lord-hp-pct">${label}</div>
        </div>
      `;
    }

    function nameBadgeHtml(p) {
      return `<div class="name-badge">${escapeHtml(p.label)}</div>`;
    }

    function rowHtml(p, gridCol, gridRow) {
      const classes = ["row"];
      if (p.is_you) classes.push("you");
      if (p.is_defeated) classes.push("defeated");
      const theme = cfg.theme || "rgb";
      if (theme !== "rgb") classes.push("theme-shc");
      // Nur "GREIFT AN" (reaktiv, bestätigt) löst den Puls aus - "ANGRIFF
      // BEVORSTEHEND" ist nur eine Vorhersage, gleicher neutraler Look wie
      // "baut auf" (Nutzerwunsch 2026-09-06).
      const isAttacking = cfg.highlight_attack_status && p.attack_status === "GREIFT AN";
      const styleParts = [];
      if (gridCol && gridRow) {
        // Explizite Grid-Position statt zweier unabhängiger Flex-Spalten:
        // so landen linke und rechte Spalte in derselben Grid-ZEILE und
        // werden von CSS automatisch auf dieselbe Höhe gebracht, auch wenn
        // eine Seite durch einen Status-Badge ("baut auf" etc.) höher ist
        // als die andere - sonst rutschen die beiden Spalten gegeneinander.
        styleParts.push(`grid-column:${gridCol}`, `grid-row:${gridRow}`);
      }
      if (theme === "shc_multi") {
        // Jeder Rahmen bekommt das gemeinsame Pergament als eigenes Bild -
        // "Pergament gewinnt immer". Kein Farbschleier darüber: die PNG ist
        // mit echter Transparenz gespeichert (Schriftrollen-Form statt
        // Rechteck) - ein Schleier würde diese Transparenz zupflastern.
        // Angriffs-Status bleibt weiterhin über Rahmenfarbe/Puls sichtbar.
        styleParts.push("background-image:url(/bg/frame-parchment.png)");
        styleParts.push("background-size:100% 100%");
      }
      if (isAttacking) {
        classes.push("attacking");
        if (cfg.attack_pulse !== false) {
          classes.push("pulse");
          // Negativer Delay, synchronisiert auf die echte Uhrzeit, damit die
          // Puls-Animation nach jedem innerHTML-Neuaufbau (alle 500ms) nicht
          // sichtbar von vorne startet, sondern nahtlos weiterläuft.
          const cycleMs = 1000;
          const offset = Date.now() % cycleMs;
          styleParts.push(`animation-delay:-${offset}ms`);
        }
      }
      const styleAttr = styleParts.length ? ` style="${styleParts.join(';')}"` : "";
      const defs = STAT_DEFS.filter((d) => cfg[d.flag]);
      const stats = defs.map((d) => statHtml(d, p)).join("");
      let statusHtml = "";
      if (cfg.highlight_attack_status && p.attack_status && p.attack_status !== "?") {
        statusHtml = `<div class="status${isAttacking ? " attack" : ""}">${escapeHtml(p.attack_status)}</div>`;
      }
      return `
        <div class="${classes.join(' ')}" data-slot="${p.slot}"${styleAttr}>
          ${nameBadgeHtml(p)}
          ${statusHtml}
          ${lordHpColHtml(p)}
          <div class="stats">${stats}</div>
          ${breakdownHtml(p)}
        </div>
      `;
    }

    function breakdownHtml(p) {
      let items = "";
      if (cfg.show_troop_breakdown && p.units) {
        const entries = sortUnitEntries(Object.entries(p.units).filter(([, v]) => v && v > 0));
        items = entries
          .map(([key, val]) => `
            <div class="unit" data-key="${key}">
              <img src="/icons/${key}.png" alt="">
              <span>${val}</span>
            </div>
          `)
          .join("");
      }
      // Unabhängig vom Aufschlüsselungs-Haken, da hier eh nur die Summe
      // existiert (siehe .siege-combo CSS - immer rechts, kein Einzeltyp).
      // Katapult-Icon extra eng zugeschnitten (unit_catapult_large.png,
      // ohne den transparenten Rand des Original-Sprites), damit es trotz
      // gleicher --breakdown-icon-size wie die anderen Icons den Rahmen
      // sichtbar mehr ausfüllt.
      if (cfg.show_siege_movable && p.siege_movable_total) {
        items += `
          <div class="unit siege-combo" data-key="__siege__">
            <img src="/icons/unit_catapult_large.png" alt="">
            <span>${p.siege_movable_total}</span>
          </div>
        `;
      }
      if (!items) return "";
      return `<div class="breakdown">${items}</div>`;
    }

    // Patcht die Truppen-Aufschlüsselung gezielt statt sie komplett neu
    // einzusetzen - gleiche Logik wie in overlay.html (siehe dortiger
    // Kommentar für die Herleitung), hier dupliziert, da beide Seiten kein
    // gemeinsames JS teilen (Projekt-Konvention). Jedes .unit-Element trägt
    // data-key (Einheitentyp bzw. "__siege__"), wird per Key gematcht und
    // per insertBefore in die richtige Reihenfolge gebracht.
    function patchBreakdown(breakdownEl, p) {
      const desired = [];
      if (cfg.show_troop_breakdown && p.units) {
        sortUnitEntries(Object.entries(p.units).filter(([, v]) => v && v > 0))
          .forEach(([key, val]) => desired.push({ key, val, siege: false }));
      }
      if (cfg.show_siege_movable && p.siege_movable_total) {
        desired.push({ key: "__siege__", val: p.siege_movable_total, siege: true });
      }

      const existing = new Map();
      Array.from(breakdownEl.children).forEach((el) => existing.set(el.dataset.key, el));

      let cursor = breakdownEl.firstChild;
      desired.forEach(({ key, val, siege }) => {
        let el = existing.get(key);
        if (el) {
          existing.delete(key);
          const span = el.querySelector("span");
          const newVal = String(val);
          if (span && span.textContent !== newVal) span.textContent = newVal;
        } else {
          el = document.createElement("div");
          el.className = siege ? "unit siege-combo" : "unit";
          el.dataset.key = key;
          const img = document.createElement("img");
          img.src = siege ? "/icons/unit_catapult_large.png" : `/icons/${key}.png`;
          img.alt = "";
          const span = document.createElement("span");
          span.textContent = String(val);
          el.appendChild(img);
          el.appendChild(span);
        }
        if (cursor !== el) {
          breakdownEl.insertBefore(el, cursor);
        } else {
          cursor = cursor.nextSibling;
        }
      });

      existing.forEach((el) => el.remove());
    }

    const DEMO_UNITS = { unit_archer: 12, unit_swordsman: 8, unit_knight: 3 };
    const DEMO_FOOD = { bread: 40, cheese: 15, meat: 10, apples: 25, ale: 8, pitch: 18, hops: 22, wheat: 60, flour: 35, food_total: 90 };
    const DEMO_WEAPONS = { bows: 12, crossbows: 6, spears: 20, pikes: 4, maces: 3, swords: 9, leather_armor: 14, metal_armor: 5 };
    const DEMO_PLAYERS = [
      { slot: 0, label: "Du", gold: 3200, wood: 145, stone: 60, iron: 20, troops: 42, siege_movable_total: 2, popularity: 78, population: 34, population_capacity: 42, tax_rate: 3, monks_trained: 4, lord_hp: 150000, lord_hp_percent: 100, win_probability_percent: 71, is_you: true, units: DEMO_UNITS, ...DEMO_FOOD, ...DEMO_WEAPONS },
      { slot: 1, label: "Gegner 1", gold: 1800, wood: 90, stone: 30, iron: 5, troops: 27, siege_movable_total: 0, popularity: 55, population: 21, population_capacity: 26, tax_rate: 7, monks_trained: 0, lord_hp: 132000, lord_hp_percent: 88, win_probability_percent: 29, is_you: false, units: DEMO_UNITS, attack_status: "baut auf", ...DEMO_FOOD, ...DEMO_WEAPONS },
      { slot: 2, label: "Gegner 2", gold: 640, wood: 55, stone: 12, iron: 0, troops: 61, siege_movable_total: 4, popularity: 40, population: 15, population_capacity: 18, tax_rate: 1, monks_trained: 2, lord_hp: 98000, lord_hp_percent: 65, win_probability_percent: 58, is_you: false, units: DEMO_UNITS, attack_status: "ANGRIFF BEVORSTEHEND", attack_base: 55, ...DEMO_FOOD, ...DEMO_WEAPONS },
      { slot: 3, label: "Gegner 3", gold: 12500, wood: 310, stone: 180, iron: 90, troops: 15, siege_movable_total: 0, popularity: 92, population: 58, population_capacity: 66, tax_rate: 10, monks_trained: 7, lord_hp: 150000, lord_hp_percent: 100, win_probability_percent: 42, is_you: false, units: DEMO_UNITS, ...DEMO_FOOD, ...DEMO_WEAPONS },
    ];

    // Statt bei JEDEM Poll (alle 500ms) das komplette Zeilen-HTML (inkl.
    // aller <img>-Tags) neu einzusetzen - was den Browser dazu bringt, jedes
    // Icon kurz neu aufzubauen ("Blinken") - wird hier nur bei einer echten
    // STRUKTUR-Änderung (andere Spieleranzahl/-reihenfolge, andere aktive
    // Werte, anderes Layout/Theme) komplett neu gebaut. Bei reinen
    // Werte-Änderungen (der Normalfall bei jedem Poll) wird stattdessen nur
    // der Text in den vorhandenen <span>-Elementen aktualisiert - die
    // <img>-Elemente selbst bleiben unangetastet, kein Blinken mehr.
    let lastStructKey = null;
    const rowIndex = new Map(); // slot -> Zeilen-Element

    // side_mode "teams": eigenes Team (inkl. Slot 0) links, alle anderen
    // rechts. Fällt auf die alte "split"-Hälftelung zurück, wenn Slot 0
    // keinem Team zugeordnet ist (z.B. team_assignment noch nicht gepflegt).
    // KEIN Live-Team-Feld gefunden (ausführlich gesucht, siehe
    // project_shc_overlay_status.md) - läuft komplett über die manuelle
    // team_assignment-Zuordnung aus den Einstellungen.
    function splitByTeam(players) {
      const assign = cfg.team_assignment || {};
      const myTeam = assign["0"];
      if (myTeam === null || myTeam === undefined) {
        const mid = Math.ceil(players.length / 2);
        return [players.slice(0, mid), players.slice(mid)];
      }
      const left = players.filter((p) => assign[String(p.slot)] === myTeam);
      const right = players.filter((p) => assign[String(p.slot)] !== myTeam);
      // Bei mehr als 2 Teams (z.B. 2v2v2) nach Team-Nummer gruppieren,
      // sonst koennten zwei gegnerische Teams auf der rechten Seite
      // durcheinandergemischt werden, nur weil ihre Spieler-Slots verstreut
      // liegen (Nutzerwunsch 2026-09-06, gleicher Fix wie in overlay.html).
      right.sort((a, b) => {
        const ta = assign[String(a.slot)];
        const tb = assign[String(b.slot)];
        if (ta === tb) return 0;
        if (ta === null || ta === undefined) return 1;
        if (tb === null || tb === undefined) return -1;
        return ta - tb;
      });
      return [left, right];
    }

    function computeSides(players, sideMode) {
      if (sideMode === "teams") return splitByTeam(players);
      const mid = Math.ceil(players.length / 2);
      return [players.slice(0, mid), players.slice(mid)];
    }

    function structKeyFor(players, defs) {
      return [
        cfg.side_mode || "split",
        cfg.theme || "rgb",
        defs.map((d) => d.flag).join(","),
        // show_lord_hp steuert seit 2026-09-06 eine eigene Säule statt
        // eines normalen Eintrags in defs - muss deshalb jetzt explizit
        // mit rein, sonst bleibt ein Umschalten bis zum nächsten "echten"
        // Strukturwechsel unsichtbar (gleiches Prinzip wie bei
        // team_assignment unten).
        cfg.show_lord_hp ? 1 : 0,
        players.map((p) => p.slot).join(","),
        // team_assignment beeinflusst bei side_mode "teams" die Links/Rechts-
        // Zuordnung, ohne dass sich die Spielerliste selbst ändert - muss
        // deshalb explizit mit in den Struktur-Schlüssel, sonst bleibt eine
        // Team-Änderung bis zum nächsten "echten" Strukturwechsel unsichtbar.
        JSON.stringify(cfg.team_assignment || {}),
      ].join("|");
    }

    function patchRow(rowEl, p, defs, gridCol, gridRow) {
      // Ausgrauen bei Niederlage - kein Struktur-Rebuild noetig (Slot
      // bleibt derselbe), deshalb hier per Toggle statt in structKeyFor.
      rowEl.classList.toggle("defeated", !!p.is_defeated);

      // Nur "GREIFT AN" (reaktiv, bestätigt) löst den Puls aus - "ANGRIFF
      // BEVORSTEHEND" ist nur eine Vorhersage, gleicher neutraler Look wie
      // "baut auf" (Nutzerwunsch 2026-09-06).
      const isAttacking = cfg.highlight_attack_status && p.attack_status === "GREIFT AN";

      const labelEl = rowEl.querySelector(".name-badge");
      if (labelEl && labelEl.textContent !== p.label) labelEl.textContent = p.label;

      const statEls = rowEl.querySelectorAll(".stats .stat");
      defs.forEach((def, i) => {
        const statEl = statEls[i];
        if (!statEl) return;
        const valEl = statEl.lastElementChild;
        const newVal = statValueText(def, p);
        if (valEl && valEl.textContent !== newVal) valEl.textContent = newVal;
        if (def.isTaxRate) {
          const iconEl = statEl.querySelector(".tax-mood-icon");
          const newSrc = taxIconSrc(p.tax_rate);
          if (iconEl && !iconEl.getAttribute("src").endsWith(newSrc)) {
            iconEl.setAttribute("src", newSrc);
          }
        }
      });

      // Burgherr-HP-Säule: nur Füllhöhe/Farbe/Text aktualisieren, nicht
      // neu einsetzen (gleiches Prinzip wie overlay.html).
      const lordHpCol = rowEl.querySelector(".lord-hp-col");
      if (lordHpCol) {
        const pct = p.lord_hp_percent;
        const fillPct = (pct === null || pct === undefined) ? 0 : Math.max(0, Math.min(100, pct));
        const fillEl = lordHpCol.querySelector(".lord-hp-fill");
        const pctEl = lordHpCol.querySelector(".lord-hp-pct");
        const newCls = "lord-hp-fill " + lordHpClass(pct);
        if (fillEl && fillEl.className !== newCls) fillEl.className = newCls;
        if (fillEl && fillEl.style.height !== `${fillPct}%`) fillEl.style.height = `${fillPct}%`;
        const newLabel = (pct === null || pct === undefined) ? "-" : `${pct}%`;
        if (pctEl && pctEl.textContent !== newLabel) pctEl.textContent = newLabel;
      }

      // Truppen-Aufschlüsselung: gezielt patchen statt komplett neu
      // einzusetzen (siehe patchBreakdown) - vorher blinkten hier bei jeder
      // Wertänderung alle Icons (gleicher Fix wie in overlay.html,
      // 2026-09-06 vom Nutzer gemeldet). Anders als overlay.html existiert
      // .breakdown hier NICHT permanent (siehe breakdownHtml() - gibt ""
      // zurück, wenn nichts anzuzeigen ist, wegen der sichtbaren
      // padding/border-top auch im leeren Zustand) - also selbst um
      // Erzeugen/Entfernen kümmern statt nur um den Inhalt.
      const oldBreakdownEl = rowEl.querySelector(".breakdown");
      if (oldBreakdownEl) {
        patchBreakdown(oldBreakdownEl, p);
        if (!oldBreakdownEl.children.length) oldBreakdownEl.remove();
      } else {
        const newBreakdownOuter = breakdownHtml(p);
        if (newBreakdownOuter) {
          const tmp = document.createElement("div");
          tmp.innerHTML = newBreakdownOuter;
          rowEl.appendChild(tmp.firstElementChild);
        }
      }

      const shouldShowStatus = cfg.highlight_attack_status && p.attack_status && p.attack_status !== "?";
      let statusEl = rowEl.querySelector(".status");
      if (shouldShowStatus) {
        if (!statusEl) {
          statusEl = document.createElement("div");
          rowEl.insertBefore(statusEl, rowEl.firstChild);
        }
        statusEl.className = `status${isAttacking ? " attack" : ""}`;
        if (statusEl.textContent !== p.attack_status) statusEl.textContent = p.attack_status;
      } else if (statusEl) {
        statusEl.remove();
      }

      const classes = ["row"];
      if (p.is_you) classes.push("you");
      const theme = cfg.theme || "rgb";
      if (theme !== "rgb") classes.push("theme-shc");
      const wasAttacking = rowEl.classList.contains("attacking");
      if (isAttacking) classes.push("attacking");
      const wantsPulse = isAttacking && cfg.attack_pulse !== false;
      if (wantsPulse) classes.push("pulse");
      rowEl.className = classes.join(" ");

      const styleParts = [];
      if (gridCol && gridRow) styleParts.push(`grid-column:${gridCol}`, `grid-row:${gridRow}`);
      if (theme === "shc_multi") {
        styleParts.push("background-image:url(/bg/frame-parchment.png)");
        styleParts.push("background-size:100% 100%");
      }
      if (wantsPulse) {
        if (!wasAttacking) rowEl.dataset.animDelay = `-${Date.now() % 1000}ms`;
        styleParts.push(`animation-delay:${rowEl.dataset.animDelay || "0ms"}`);
      }
      rowEl.style.cssText = styleParts.join(";");
    }

    // Ausweich-Palette nach Slot-Nummer (nicht Array-Position) indiziert -
    // dieselbe Logik wie in overlay.html/win_bar.html (bewusst dupliziert,
    // kein Shared-JS-Mechanismus in diesem Projekt).
    const WIN_BAR_FALLBACK_PALETTE = [
      "#4f8fef", "#e6463c", "#3ecf6e", "#e6b93e",
      "#b56ce6", "#3ecfc9", "#e68f3e", "#8f8f8f",
    ];
    const DEMO_SIDES = [
      { key: "team:1", label: "Team 1", representative_slot: 0, team_number: 1, share_percent: 63, win_probability_percent: 71 },
      { key: "team:2", label: "Team 2", representative_slot: 2, team_number: 2, share_percent: 37, win_probability_percent: 29 },
    ];

    function winBarColorForSide(side) {
      if (side.team_number !== null && side.team_number !== undefined) {
        const teamColor = (cfg.team_colors || {})[String(side.team_number)];
        if (teamColor) return teamColor;
      }
      const pc = (cfg.player_colors || {})[String(side.representative_slot)];
      if (pc && pc.border_color) return pc.border_color;
      return WIN_BAR_FALLBACK_PALETTE[side.representative_slot % WIN_BAR_FALLBACK_PALETTE.length];
    }

    // Segmente/Zeilen werden NICHT bei jedem Poll neu gebaut - siehe
    // ausfuehrlicher Kommentar bei derselben Logik in win_bar.html (sonst
    // haette eine frisch erzeugte CSS-transition keinen Ausgangswert zum
    // Animieren). Stattdessen bleiben die Elemente ueber Polls hinweg
    // bestehen (nach side.key gemerkt), nur bei echter Struktur-Aenderung
    // (Seite kommt/geht) wird neu aufgebaut.
    let lastWinBarSegKeys = null;
    const winBarSegElements = new Map(); // side.key -> Element

    function renderWinBarSegmented(sides) {
      const box = document.getElementById("win-bar-segmented");
      const keys = sides.map((s) => s.key).join("|");
      if (keys !== lastWinBarSegKeys) {
        box.innerHTML = "";
        winBarSegElements.clear();
        sides.forEach((s) => {
          const el = document.createElement("div");
          el.className = "segment";
          box.appendChild(el);
          winBarSegElements.set(s.key, el);
        });
        lastWinBarSegKeys = keys;
      }
      sides.forEach((s) => {
        const el = winBarSegElements.get(s.key);
        if (!el) return;
        const grow = String(Math.max(s.share_percent, 0.001));
        if (el.style.flexGrow !== grow) el.style.flexGrow = grow;
        const color = winBarColorForSide(s);
        el.style.background = color;
        el.style.setProperty("--seam-color", color);
        const text = `${s.label} · ${s.share_percent.toFixed(0)}%`;
        if (el.textContent !== text) el.textContent = text;
      });
    }

    let lastWinBarIndKeys = null;
    const winBarIndElements = new Map(); // side.key -> {label, fill, pct}

    function renderWinBarIndividual(sides) {
      const box = document.getElementById("win-bar-individual");
      const keys = sides.map((s) => s.key).join("|");
      if (keys !== lastWinBarIndKeys) {
        box.innerHTML = "";
        winBarIndElements.clear();
        sides.forEach((s) => {
          const row = document.createElement("div");
          row.className = "individual-row";
          row.innerHTML = `
            <div class="individual-label"></div>
            <div class="individual-track">
              <div class="individual-fill"></div>
              <div class="individual-percent"></div>
            </div>
          `;
          box.appendChild(row);
          winBarIndElements.set(s.key, {
            label: row.querySelector(".individual-label"),
            fill: row.querySelector(".individual-fill"),
            pct: row.querySelector(".individual-percent"),
          });
        });
        lastWinBarIndKeys = keys;
      }
      // Bei genau 2 Seiten ist win_probability_percent eine echte 1v1-
      // Chance (summiert mit der Gegenseite auf ~100%). Bei 3+ Seiten waere
      // es "diese Seite gegen alle anderen zusammen" - ein Wert, der fuer
      // alle klein ist und sich zu nichts Sinnvollem summiert; dort
      // stattdessen share_percent zeigen (Anteil an der Gesamtstaerke,
      // summiert IMMER auf 100%), wie im segmentierten Modus.
      const indUseShare = sides.length > 2;
      sides.forEach((s) => {
        const refs = winBarIndElements.get(s.key);
        if (!refs) return;
        if (refs.label.textContent !== s.label) refs.label.textContent = s.label;
        const value = indUseShare ? s.share_percent : s.win_probability_percent;
        const widthStr = `${value}%`;
        if (refs.fill.style.width !== widthStr) refs.fill.style.width = widthStr;
        refs.fill.style.background = winBarColorForSide(s);
        const pctText = `${Math.round(value)}%`;
        if (refs.pct.textContent !== pctText) refs.pct.textContent = pctText;
      });
    }

    function renderWinBar(sidesFromData) {
      const winBarCfg = cfg.win_bar || {};
      const box = document.getElementById("win-bar");
      if (!winBarCfg.show_in_overview) {
        box.style.display = "none";
        return;
      }
      box.style.display = "block";
      let sides = sidesFromData || [];
      if (sides.length === 0) sides = DEMO_SIDES;

      const segBox = document.getElementById("win-bar-segmented");
      const indBox = document.getElementById("win-bar-individual");
      if ((winBarCfg.mode || "segmented") === "individual") {
        segBox.style.display = "none";
        indBox.style.display = "flex";
        renderWinBarIndividual(sides);
      } else {
        indBox.style.display = "none";
        segBox.style.display = "flex";
        renderWinBarSegmented(sides);
      }
    }

    function render(data) {
      const rows = document.getElementById("rows");
      const emptyMsg = document.getElementById("empty-msg");
      if (data && data.blocked) {
        rows.innerHTML = "";
        rows.classList.remove("split");
        rowIndex.clear();
        lastStructKey = null;
        document.getElementById("win-bar").style.display = "none";
        emptyMsg.textContent = "Live-Stats deaktiviert";
        emptyMsg.style.display = "block";
        return;
      }
      // Spiel vorbei/pausiert (worker.py Stall-Erkennung): alles ausgrauen,
      // Karten bleiben aber stehen.
      document.body.classList.toggle("stalled", !!(data && data.stalled));
      let players = (data && data.players) || [];

      if (players.length === 0) {
        if (cfg.show_demo_data === false) {
          rows.innerHTML = "";
          rows.classList.remove("split");
          rowIndex.clear();
          lastStructKey = null;
          emptyMsg.textContent = "Warte auf Spieldaten …";
          emptyMsg.style.display = "block";
          return;
        }
        players = DEMO_PLAYERS;
      }
      emptyMsg.style.display = "none";

      const sideMode = cfg.side_mode || "split";
      const isSingle = (cfg.theme || "rgb") === "shc_single";
      const defs = STAT_DEFS.filter((d) => cfg[d.flag]);
      const structKey = structKeyFor(players, defs) + "|" + sideMode;

      if (structKey !== lastStructKey) {
        rebuildRows(players, sideMode, isSingle, rows);
        rowIndex.clear();
        [...rows.children].forEach((el) => {
          if (el.dataset.slot !== undefined) rowIndex.set(Number(el.dataset.slot), el);
        });
        lastStructKey = structKey;
        return;
      }

      if (sideMode === "split" || sideMode === "teams") {
        const [leftPlayers, rightPlayers] = computeSides(players, sideMode);
        const mid = Math.max(leftPlayers.length, rightPlayers.length);
        for (let i = 0; i < mid; i++) {
          if (leftPlayers[i]) {
            const el1 = rowIndex.get(leftPlayers[i].slot);
            if (el1) patchRow(el1, leftPlayers[i], defs, 1, i + 1);
          }
          if (rightPlayers[i]) {
            const el2 = rowIndex.get(rightPlayers[i].slot);
            if (el2) patchRow(el2, rightPlayers[i], defs, 2, i + 1);
          }
        }
      } else {
        players.forEach((p) => {
          const el = rowIndex.get(p.slot);
          if (el) patchRow(el, p, defs, null, null);
        });
      }
    }

    function rebuildRows(players, sideMode, isSingle, rows) {
      if (sideMode === "split" || sideMode === "teams") {
        const [leftPlayers, rightPlayers] = computeSides(players, sideMode);
        const mid = Math.max(leftPlayers.length, rightPlayers.length);
        // Linke und rechte Seite werden paarweise in dieselbe Grid-Zeile
        // gesetzt (statt als zwei unabhängige Spalten aneinandergereiht),
        // damit ungleich hohe Karten (z.B. durch einen Angriffs-Badge) beide
        // Seiten nicht gegeneinander verschieben - siehe rowHtml().
        // Bei Theme "SHC Single" bekommt jede Seite zusätzlich ein eigenes
        // Pergament, das über die volle Grid-Höhe dieser Spalte reicht
        // (hinter allen Rahmen dieser Seite liegt, siehe .side-backdrop).
        // "-1" würde hier auf das Ende des EXPLIZITEN Grids zeigen (das es
        // nicht gibt, nur grid-auto-rows) und fällt ohne grid-template-rows
        // auf Zeile 1 zurück. Eine großzügig hohe Endzeile (z.B. 999)
        // funktioniert auch nicht: der Grid muss dann wirklich 999 implizite
        // Zeilen anlegen, und row-gap zwischen all diesen (leeren) Zeilen
        // summiert sich zu einer riesigen Gesamthöhe. Also die tatsächliche
        // Zeilenzahl je Seite verwenden.
        const rowEnd = mid + 1;
        let html = isSingle
          ? `<div class="side-backdrop" style="grid-column:1;grid-row:1/${rowEnd}"></div><div class="side-backdrop" style="grid-column:2;grid-row:1/${rowEnd}"></div>`
          : "";
        for (let i = 0; i < mid; i++) {
          html += rowHtml(leftPlayers[i], 1, i + 1);
          if (rightPlayers[i]) html += rowHtml(rightPlayers[i], 2, i + 1);
        }
        rows.classList.add("split");
        rows.classList.remove("theme-single-bg");
        rows.innerHTML = html;
      } else {
        rows.classList.remove("split");
        // Nur eine Liste (kein Split) - das Pergament kommt direkt als
        // Hintergrund des Listen-Containers selbst, analog zu einer Seite.
        rows.classList.toggle("theme-single-bg", isSingle);
        rows.innerHTML = players.map((p) => rowHtml(p)).join("");
      }
    }

    async function pollData() {
      try {
        const res = await fetch("/overlay.json?t=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        render(data);
        if (!(data && data.blocked)) renderWinBar(data && data.sides);
      } catch (e) {
        // stiller Retry
      }
    }

    // Staerkeindex-Refresh-Intervall (siehe WIN_BAR_TRANSITION_MS-Kommentar
    // in win_bar.html) - die Balkengrenzen gleiten durchgehend, statt kurz
    // zu springen und dann stillzustehen. Muss zu worker.WIN_PROB_REFRESH_S
    // passen.
    document.documentElement.style.setProperty("--transition-ms", "2000ms");

    function applyLayout() {
      const root = document.documentElement.style;
      root.setProperty("--you-color", cfg.you_color || "#78c8ff");
      root.setProperty("--attack-color", cfg.attack_color || "#e6463c");
      root.setProperty("--row-gap", (cfg.row_gap_px ?? 14) + "px");
      root.setProperty("--text-color", cfg.text_color || "#f2e9d8");
      root.setProperty("--breakdown-icon-size", (cfg.breakdown_icon_size_px ?? 22) + "px");
    }

    async function pollConfig() {
      try {
        const res = await fetch("/api/overview-config?t=" + Date.now(), { cache: "no-store" });
        cfg = await res.json();
        applyLayout();
      } catch (e) {
        // stiller Retry
      }
    }

    pollConfig().then(pollData);
    setInterval(pollData, 400);
    setInterval(pollConfig, 1000);

    const settingsPanel = document.getElementById("settings-panel");
    const settingsFrame = document.getElementById("settings-frame");
    const settingsToggle = document.getElementById("settings-toggle");
    let settingsLoaded = false;
    settingsToggle.addEventListener("click", () => {
      if (!settingsLoaded) {
        settingsFrame.src = "/overview-settings.html";
        settingsLoaded = true;
      }
      settingsPanel.classList.toggle("open");
    });
  </script>
</body>
</html>
